<svg xmlns="http://www.w3.org/2000/svg" viewBox="-6 -2 92 92">
  <style>
    .char { animation: bob 3.2s ease-in-out infinite; }
    .eyes { transform-box: fill-box; transform-origin: center; animation: blink 4.6s infinite; }
    .arm-l { animation: type 0.5s ease-in-out infinite; }
    .arm-r { animation: type 0.5s ease-in-out infinite 0.25s; }
    .cursor { animation: cursor 1s steps(1) infinite; }
    .code { stroke-dasharray: 30; stroke-dashoffset: 30; animation: code 3.6s linear infinite; }
    .code2 { animation-delay: 0.9s; }
    .code3 { animation-delay: 1.8s; }
    .tent { transform-box: fill-box; transform-origin: 50% 0; animation: sway 3s ease-in-out infinite; }
    .t2 { animation-delay: -0.6s; } .t3 { animation-delay: -1.2s; } .t4 { animation-delay: -1.8s; } .t5 { animation-delay: -2.4s; }
    .bubble { animation: bubble 3.6s ease-in infinite; opacity: 0; }
    @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-2.5px); } }
    @keyframes blink { 0%, 92%, 100% { transform: scaleY(1); } 95% { transform: scaleY(0.1); } }
    @keyframes type { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-1.6px); } }
    @keyframes cursor { 0% { opacity: 1; } 50% { opacity: 0; } }
    @keyframes code { 0% { stroke-dashoffset: 30; } 35%, 85% { stroke-dashoffset: 0; } 100% { stroke-dashoffset: 0; opacity: 0; } }
    @keyframes sway { 0%, 100% { transform: rotate(-5deg); } 50% { transform: rotate(5deg); } }
    @keyframes bubble { 0% { transform: translateY(0); opacity: 0; } 20% { opacity: 0.8; } 100% { transform: translateY(-14px); opacity: 0; } }
    @media (prefers-reduced-motion: reduce) {
      .char, .eyes, .tent, .arm-l, .arm-r, .cursor, .bubble { animation: none; }
      .code { animation: none; stroke-dashoffset: 0; }
    }
      /* static: no continuous animation */
    * { animation: none !important; }
  </style>
  <defs>
    <linearGradient id="bell" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b6f0ff"/>
      <stop offset="1" stop-color="#9a86ff"/>
    </linearGradient>
    <linearGradient id="tent" gradientUnits="userSpaceOnUse" x1="0" y1="36" x2="0" y2="90">
      <stop offset="0" stop-color="#a894ff"/>
      <stop offset="1" stop-color="#d4b8ff" stop-opacity="0.15"/>
    </linearGradient>
  </defs>

  <circle class="bubble" cx="71" cy="18" r="2" fill="none" stroke="#8fe4ff" stroke-width="1"/>

  <g class="char">
    <!-- tentacles hang from the rim of the bell and drift behind the laptop -->
    <g fill="none" stroke="url(#tent)" stroke-linecap="round">
      <path class="tent" stroke-width="2.4" d="M19 37c-3 8 1 14-3 22s0 14-4 22"/>
      <path class="tent t2" stroke-width="2.6" d="M27 39c-2 9 2 16-1 25s2 13-1 21"/>
      <path class="tent t3" stroke-width="2.8" d="M35 40c-1 10 2 18 0 27s2 12 0 20"/>
      <path class="tent t4" stroke-width="2.8" d="M45 40c1 10-2 18 0 27s-2 12 0 20"/>
      <path class="tent t5" stroke-width="2.6" d="M53 39c2 9-2 16 1 25s-2 13 1 21"/>
      <path class="tent t2" stroke-width="2.4" d="M61 37c3 8-1 14 3 22s0 14 4 22"/>
    </g>

    <!-- bell -->
    <path d="M13 37C13 17 25 4 40 4s27 13 27 33c-4.5 3-9 0-13.5 3-4.5-3-9 0-13.5-2-4.5 2-9-1-13.5 2-4.5-3-9 0-13.5-3z" fill="url(#bell)"/>
    <ellipse cx="26" cy="14" rx="6" ry="3" fill="#fff" opacity="0.55" transform="rotate(-32 26 14)"/>
    <g class="eyes">
      <ellipse cx="31" cy="23" rx="4.6" ry="5.4" fill="#fff"/>
      <ellipse cx="49" cy="23" rx="4.6" ry="5.4" fill="#fff"/>
      <circle cx="31.5" cy="25" r="2.9" fill="#0b1324"/>
      <circle cx="49.5" cy="25" r="2.9" fill="#0b1324"/>
      <circle cx="32.6" cy="23.8" r="1.1" fill="#fff"/>
      <circle cx="50.6" cy="23.8" r="1.1" fill="#fff"/>
    </g>
    <circle cx="24" cy="30" r="2.4" fill="#ff9ccf" opacity="0.7"/>
    <circle cx="56" cy="30" r="2.4" fill="#ff9ccf" opacity="0.7"/>
    <path d="M36.5 30.5q3.5 3 7 0" fill="none" stroke="#0b1324" stroke-width="1.8" stroke-linecap="round"/>

    <!-- laptop held in front -->
    <g>
      <rect x="25" y="47" width="30" height="19" rx="2.5" fill="#0b1324" stroke="#8fe4ff" stroke-width="1.6"/>
      <rect x="27.5" y="49.5" width="25" height="14" rx="1.2" fill="#132a46"/>
      <path class="code" d="M30 53h11" stroke="#8fe4ff" stroke-width="1.5" stroke-linecap="round"/>
      <path class="code code2" d="M32 56.5h14" stroke="#c9a7ff" stroke-width="1.5" stroke-linecap="round"/>
      <path class="code code3" d="M32 60h8" stroke="#ff9ccf" stroke-width="1.5" stroke-linecap="round"/>
      <rect class="cursor" x="41.5" y="58.8" width="1.5" height="2.5" fill="#e8fbff"/>
      <path d="M21 66h38l-3 3.5H24z" fill="#6b7da3"/>
      <path d="M36 66h8l-0.8 1.2h-6.4z" fill="#3c4a68"/>
    </g>

    <!-- two arms reach down to the keyboard -->
    <g fill="none" stroke="#a894ff" stroke-width="2.8" stroke-linecap="round">
      <path class="arm-l" d="M23 38c-3 7-4 15-2 22 1 3 4 5 9 5.5"/>
      <path class="arm-r" d="M57 38c3 7 4 15 2 22-1 3-4 5-9 5.5"/>
    </g>
  </g>
</svg>
