# Blog locations for the existing graysoncodes.org nginx server block.
# Install:  sudo cp nginx-blog.conf /etc/nginx/snippets/graysoncodes-blog.conf
# then add this line inside the `server { ... }` block that serves /var/www/html:
#     include snippets/graysoncodes-blog.conf;
# and run:  sudo nginx -t && sudo systemctl reload nginx
#
# Everything else (/, /assets, /case-studies, …) keeps being served from
# /var/www/html exactly as before.

location = /blog              { include snippets/graysoncodes-blog-proxy.conf; }
location ^~ /blog/            { include snippets/graysoncodes-blog-proxy.conf; }
location = /sitemap.xml       { include snippets/graysoncodes-blog-proxy.conf; }
location ^~ /admin/blog       {
    client_max_body_size 12m;   # image uploads (the app itself limits images to 10 MB)
    include snippets/graysoncodes-blog-proxy.conf;
}

# Uploaded images, straight from disk (fast, no Python involved).
location ^~ /media/ {
    alias /var/lib/graysoncodes-blog/data/media/;
    try_files $uri =404;
    types { image/jpeg jpg jpeg; image/png png; image/webp webp; image/gif gif; }
    default_type application/octet-stream;
    expires 30d;
    add_header Cache-Control "public, max-age=2592000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Content-Security-Policy "default-src 'none'; sandbox" always;
    autoindex off;
}
