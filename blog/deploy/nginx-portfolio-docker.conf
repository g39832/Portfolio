# nginx config for the "portfolio" Docker container (nginx:alpine).
# Serves the React portfolio exactly like the stock nginx:alpine config did,
# plus the blog locations. The container uses the Pi's network (network_mode: host)
# so it can reach the blog service on 127.0.0.1:5080; it listens on 8080 as before.
server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html index.htm;

    location / {
        try_files $uri $uri/ =404;
    }

    include snippets/graysoncodes-blog.conf;
}
