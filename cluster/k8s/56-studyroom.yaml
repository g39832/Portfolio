# Study Room: a Pomodoro timer in front of a fish tank you design yourself.
#   http://100.120.223.33:30420   (Tailscale, from anywhere)   http://192.168.1.35:30420 at home
# Leaving asks you to type "done". The page is cluster/studyroom/index.html. Everything you set
# (fish, decorations, timer, stats) is saved in the browser of the device you use it on.
# Put it up or update it with
#   bash ~/Portfolio/cluster/studyroom/deploy.sh
apiVersion: v1
kind: Namespace
metadata:
  name: studyroom
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: studyroom-nginx
  namespace: studyroom
data:
  default.conf: |
    server {
      listen 8080;
      root /usr/share/nginx/html;
      location = / {
        add_header Cache-Control "no-cache";
        try_files /index.html =404;
      }
      location = /icon.svg {
        types { image/svg+xml svg; }
        add_header Cache-Control "max-age=86400";
      }
      location / { return 404; }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: studyroom
  namespace: studyroom
spec:
  replicas: 1
  selector:
    matchLabels: {app: studyroom}
  template:
    metadata:
      labels: {app: studyroom}
    spec:
      containers:
        - name: nginx
          image: nginxinc/nginx-unprivileged:1.28-alpine
          ports:
            - containerPort: 8080
          volumeMounts:
            - {name: page, mountPath: /usr/share/nginx/html/index.html, subPath: index.html}
            - {name: page, mountPath: /usr/share/nginx/html/icon.svg, subPath: icon.svg}
            - {name: conf, mountPath: /etc/nginx/conf.d/default.conf, subPath: default.conf}
          readinessProbe:
            httpGet: {path: /, port: 8080}
            periodSeconds: 10
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {memory: 64Mi}
      volumes:
        - name: page          # made by studyroom/deploy.sh from studyroom/index.html + icon.svg
          configMap:
            name: studyroom-page
        - name: conf
          configMap:
            name: studyroom-nginx
---
apiVersion: v1
kind: Service
metadata:
  name: studyroom
  namespace: studyroom
spec:
  type: NodePort
  selector: {app: studyroom}
  ports:
    - port: 80
      targetPort: 8080
      nodePort: 30420
