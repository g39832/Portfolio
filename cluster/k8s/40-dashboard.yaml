# Headlamp: a web dashboard for the cluster (pods, logs, restarts, CPU/memory).
#   On your Wi-Fi:  http://<either Pi's IP>:30466
#   From anywhere:  a Cloudflare hostname locked behind Cloudflare Access (cluster/README.md)
# Sign in with the token printed by:
#   kubectl -n kube-system get secret grayson-dashboard-token -o jsonpath='{.data.token}' | base64 -d
apiVersion: v1
kind: ServiceAccount
metadata:
  name: headlamp
  namespace: kube-system
---
# The account you sign in as. It has full control of the cluster, so keep its token private.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: grayson-dashboard
  namespace: kube-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: grayson-dashboard-admin
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  - kind: ServiceAccount
    name: grayson-dashboard
    namespace: kube-system
---
apiVersion: v1
kind: Secret
metadata:
  name: grayson-dashboard-token
  namespace: kube-system
  annotations:
    kubernetes.io/service-account.name: grayson-dashboard
type: kubernetes.io/service-account-token
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: headlamp
  namespace: kube-system
spec:
  replicas: 1
  selector:
    matchLabels: {app: headlamp}
  template:
    metadata:
      labels: {app: headlamp}
    spec:
      serviceAccountName: headlamp
      containers:
        - name: headlamp
          image: ghcr.io/headlamp-k8s/headlamp:v0.40.0
          args: [-in-cluster, -plugins-dir=/headlamp/plugins]
          ports:
            - containerPort: 4466
          readinessProbe:
            httpGet: {path: /, port: 4466}
            periodSeconds: 10
          resources:
            requests: {cpu: 20m, memory: 32Mi}
            limits: {memory: 256Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: headlamp
  namespace: kube-system
spec:
  type: NodePort
  selector: {app: headlamp}
  ports:
    - port: 80
      targetPort: 4466
      nodePort: 30466
