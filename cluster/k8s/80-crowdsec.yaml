# CrowdSec: watches the public website's logs and spots attackers
# (vulnerability scans, password guessing, bad bots, path-traversal tricks...).
#
# How it fits together:
#   visitor -> Cloudflare -> cloudflared pods -> web (nginx) pods
#   nginx logs the real visitor IP (CF-Connecting-IP, see nginx/default.conf.template)
#   -> a CrowdSec "agent" on each Pi reads those logs and flags bad behaviour
#   -> the CrowdSec "LAPI" (on the Pi 5) stores the alerts and decisions (bans).
#
# k3s installs it for us from CrowdSec's official Helm chart (the HelmChart below),
# so there is no helm to install. Apply with:
#   kubectl apply -f ~/Portfolio/cluster/k8s/80-crowdsec.yaml
#
# Useful commands (run on the Pi 5):
#   kubectl -n crowdsec get pods
#   kubectl -n crowdsec exec deploy/crowdsec-lapi -- cscli alerts list
#   kubectl -n crowdsec exec deploy/crowdsec-lapi -- cscli decisions list
#   for p in $(kubectl -n crowdsec get pods -o name | grep agent); do kubectl -n crowdsec exec $p -- cscli metrics show acquisition; done
#
# Stage 1 (this file) DETECTS and records. Stage 2 (81-crowdsec-cloudflare.yaml)
# makes Cloudflare stop flagged IPs; see "Security (CrowdSec)" in cluster/README.md.
apiVersion: helm.cattle.io/v1
kind: HelmChart
metadata:
  name: crowdsec
  namespace: kube-system
spec:
  repo: https://crowdsecurity.github.io/helm-charts
  chart: crowdsec
  version: 0.24.3            # CrowdSec 1.8.2
  targetNamespace: crowdsec
  createNamespace: true
  valuesContent: |-
    # k3s uses containerd, so pod logs are in CRI format.
    container_runtime: containerd

    config:
      # What to do when an attack is spotted: a 4-hour ban (CrowdSec's default),
      # and a message to Discord.
      profiles.yaml: |
        name: default_ip_remediation
        filters:
          - Alert.Remediation == true && Alert.GetScope() == "Ip"
        decisions:
          - type: ban
            duration: 4h
        notifications:
          - discord
        on_success: break
        ---
        name: default_range_remediation
        filters:
          - Alert.Remediation == true && Alert.GetScope() == "Range"
        decisions:
          - type: ban
            duration: 4h
        notifications:
          - discord
        on_success: break
      notifications:
        # Posts each ban to a Discord channel. The webhook address is a secret
        # (crowdsec-discord, made by cluster/crowdsec-discord-setup.sh), never in git.
        discord.yaml: |
          type: http
          name: discord
          log_level: info
          url: ${DISCORD_WEBHOOK_URL}
          method: POST
          headers:
            Content-Type: application/json
          format: |
            {
              "username": "CrowdSec",
              "embeds": [
                {{- range $i, $alert := . -}}
                {{- range $j, $d := $alert.Decisions -}}
                {{- if or $i $j }},{{ end }}
                {
                  "title": "Blocked an attacker on graysoncodes.org",
                  "color": 15158332,
                  "fields": [
                    {"name": "IP", "value": {{ $d.Value | toJson }}, "inline": true},
                    {"name": "Ban length", "value": {{ $d.Duration | toJson }}, "inline": true},
                    {"name": "From", "value": {{ printf "%s %s" $alert.Source.Cn $alert.Source.AsName | trim | default "unknown" | toJson }}, "inline": true},
                    {"name": "Why", "value": {{ $d.Scenario | toJson }}}
                  ]
                }
                {{- end -}}
                {{- end }}
              ]
            }

    agent:
      # Which pod logs to read: the web nginx (both copies). It serves graysoncodes.org
      # and the blog, and passes dnd.graysoncodes.org on to Campaign Ledger.
      acquisition:
        - namespace: graysoncodes
          podName: web-*
          program: nginx
      env:
        # nginx log parser + the common web-attack scenarios.
        - name: COLLECTIONS
          value: "crowdsecurity/nginx"
        - name: TZ
          value: America/Chicago
      # The chart's defaults ask for half a CPU per pod; a Pi doesn't need that.
      resources:
        requests: {cpu: 50m, memory: 100Mi}
        limits: {memory: 250Mi}

    lapi:
      # Keep the database on the Pi 5 (the Pi 4's SD card is nearly full).
      nodeSelector:
        kubernetes.io/hostname: raspberrypi
      env:
        - name: TZ
          value: America/Chicago
        # Registers the Cloudflare blocker (k8s/81-crowdsec-cloudflare.yaml) with its key.
        # The secret is made by cluster/crowdsec-cloudflare-setup.sh; until then this is skipped.
        - name: BOUNCER_KEY_cloudflare
          valueFrom:
            secretKeyRef: {name: cloudflare-bouncer, key: lapi-key, optional: true}
        # Discord webhook for ban messages (see config.notifications above).
        - name: DISCORD_WEBHOOK_URL
          valueFrom:
            secretKeyRef: {name: crowdsec-discord, key: url, optional: true}
      persistentVolume:
        data:
          storageClassName: local-path
          size: 1Gi
        config:
          storageClassName: local-path
          size: 100Mi
      resources:
        requests: {cpu: 50m, memory: 150Mi}
        limits: {memory: 500Mi}
