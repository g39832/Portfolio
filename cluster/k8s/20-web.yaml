# The public website (portfolio + TumorSim), two copies spread over both Pis
# so the site stays up if one Pi goes down.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: graysoncodes
spec:
  replicas: 2
  selector:
    matchLabels: {app: web}
  template:
    metadata:
      labels: {app: web}
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: {app: web}
      containers:
        - name: web
          image: ghcr.io/g39832/portfolio-web:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet: {path: /healthz, port: 8080}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /healthz, port: 8080}
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            requests: {cpu: 20m, memory: 16Mi}
            limits: {memory: 128Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: graysoncodes
spec:
  selector: {app: web}
  ports:
    - port: 80
      targetPort: 8080
---
# For testing on your home Wi-Fi before the switch: http://<either Pi's IP>:30080
apiVersion: v1
kind: Service
metadata:
  name: web-lan
  namespace: graysoncodes
spec:
  type: NodePort
  selector: {app: web}
  ports:
    - port: 80
      targetPort: 8080
      nodePort: 30080
