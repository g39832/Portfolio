# Portainer: the cluster dashboard (sign in with your own username + password).
#   At home:        http://192.168.1.35:30777   (or the Pi 4's IP)
#   From anywhere:  http://100.120.223.33:30777 with Tailscale on
# The very first visit asks you to create the admin account. Do that within
# 5 minutes of Portainer starting, or it locks itself for safety; if that
# happens:  kubectl -n portainer rollout restart deployment portainer
apiVersion: v1
kind: Namespace
metadata:
  name: portainer
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: portainer
  namespace: portainer
---
# Portainer manages the cluster for you, so it needs full access to it.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: portainer
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  - kind: ServiceAccount
    name: portainer
    namespace: portainer
---
# Portainer's settings and your login live here.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: portainer-data
  namespace: portainer
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: portainer
  namespace: portainer
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: {app: portainer}
  template:
    metadata:
      labels: {app: portainer}
    spec:
      serviceAccountName: portainer
      nodeSelector:
        kubernetes.io/hostname: raspberrypi   # keep the dashboard on the Pi 5
      containers:
        - name: portainer
          image: portainer/portainer-ce:2.45.4
          args: [--http-enabled]
          ports:
            - containerPort: 9000
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            httpGet: {path: /, port: 9000}
            periodSeconds: 10
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {memory: 512Mi}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: portainer-data
---
apiVersion: v1
kind: Service
metadata:
  name: portainer
  namespace: portainer
spec:
  type: NodePort
  selector: {app: portainer}
  ports:
    - port: 9000
      targetPort: 9000
      nodePort: 30777
