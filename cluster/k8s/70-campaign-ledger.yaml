# Campaign Ledger (D&D tracker) on the Pi 5, always on.
#   Players:  https://dnd.graysoncodes.org/join   (needs the campaign's join code)
#   At home / Tailscale:  http://100.120.223.33:30505
# Anyone with the link only reaches the join page. Nobody arriving over the network is the DM:
# the DM signs in with a DM link. Make one (prints a link to open on your own devices):
#   ssh grayson@raspberrypi.local "bash ~/Portfolio/cluster/ledger-dm-link.sh"
# Making a new DM link cancels the old one.
# Data (campaign database, uploaded maps/pictures, the app's own daily backups) is on the
# saved disk "ledger-data" on the Pi 5.
apiVersion: v1
kind: Namespace
metadata:
  name: ledger
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ledger-data
  namespace: ledger
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ledger
  namespace: ledger
spec:
  replicas: 1
  strategy:
    type: Recreate          # one copy only: it owns the SQLite database
  selector:
    matchLabels: {app: ledger}
  template:
    metadata:
      labels: {app: ledger}
    spec:
      nodeSelector:
        kubernetes.io/hostname: raspberrypi
      securityContext:
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: ledger
          image: ghcr.io/g39832/campaign-ledger:latest
          imagePullPolicy: Always
          env:
            - {name: TZ, value: America/Chicago}
            - {name: LEDGER_PUBLIC_URL, value: "https://dnd.graysoncodes.org"}
            # The cluster's pod network, where the Cloudflare connector runs: lets the app see each
            # visitor's own address (for the join-code guessing limit). Never grants DM access.
            - {name: LEDGER_TRUSTED_PROXIES, value: "10.42.0.0/16"}
          ports:
            - containerPort: 5050
          volumeMounts:
            - {name: data, mountPath: /data}
          readinessProbe:
            httpGet: {path: /api/join/build, port: 5050}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /api/join/build, port: 5050}
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {memory: 1Gi}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: ledger-data
---
apiVersion: v1
kind: Service
metadata:
  name: ledger
  namespace: ledger
spec:
  type: NodePort
  selector: {app: ledger}
  ports:
    - port: 5050
      targetPort: 5050
      nodePort: 30505
