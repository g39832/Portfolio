# The start page: every app in the homelab with a live up/down check, plus the Pis' CPU and memory.
#   http://100.120.223.33:30300   (Tailscale, from anywhere)   http://192.168.1.35:30300 at home
# Same design as the Pi to DevOps Path guide. The page is cluster/start/index.html; it gets its app
# list and checks from Homepage (45-homepage.yaml, still on :30301 as the "classic" dashboard), so
# tiles are still added in Homepage's services.yaml. Put the page up or update it with
#   bash ~/Portfolio/cluster/start/deploy.sh
apiVersion: v1
kind: Namespace
metadata:
  name: start
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: start-nginx
  namespace: start
data:
  default.conf: |
    # k3s cluster DNS; looked up per request so nginx starts even if Homepage isn't up yet.
    resolver 10.43.0.10 valid=30s ipv6=off;
    server {
      listen 8080;
      root /usr/share/nginx/html;

      location = / {
        add_header Cache-Control "no-cache";
        try_files /index.html =404;
      }

      # Only the three read-only Homepage endpoints the page uses.
      location ~ ^/api/(services|siteMonitor|widgets/kubernetes)$ {
        limit_except GET { deny all; }
        set $homepage http://homepage.homepage.svc.cluster.local:3000;
        proxy_pass $homepage;
        proxy_set_header Host localhost:30300;
        proxy_read_timeout 20s;
        add_header Cache-Control "no-store";
      }

      # App icon + manifest (so Safari's "Add to Home Screen" gets the jellyfish logo) and lessons.js.
      location /i/ {
        types { image/png png; image/svg+xml svg; application/manifest+json webmanifest; text/javascript js; }
        add_header Cache-Control "max-age=86400";
      }

      # The full lessons change more often than the icons, so always check for a new copy.
      location = /i/tank.js {
        types { text/javascript js; }
        add_header Cache-Control "no-cache";
      }

      location = /i/lessons.js {
        types { text/javascript js; }
        add_header Cache-Control "no-cache";
      }

      location / { return 404; }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: start
  namespace: start
spec:
  replicas: 1
  selector:
    matchLabels: {app: start}
  template:
    metadata:
      labels: {app: start}
    spec:
      containers:
        - name: nginx
          image: nginxinc/nginx-unprivileged:1.28-alpine
          ports:
            - containerPort: 8080
          volumeMounts:
            - {name: page, mountPath: /usr/share/nginx/html/index.html, subPath: index.html}
            - {name: conf, mountPath: /etc/nginx/conf.d/default.conf, subPath: default.conf}
            - {name: icons, mountPath: /usr/share/nginx/html/i}
          readinessProbe:
            httpGet: {path: /, port: 8080}
            periodSeconds: 10
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {memory: 64Mi}
      volumes:
        - name: page
          configMap:
            name: start-page
        - name: conf
          configMap:
            name: start-nginx
        - name: icons          # made by start/deploy.sh from start/icon.svg, the PNGs and the manifest
          configMap:
            name: start-icons
            optional: true
---
apiVersion: v1
kind: Service
metadata:
  name: start
  namespace: start
spec:
  type: NodePort
  selector: {app: start}
  ports:
    - port: 80
      targetPort: 8080
      nodePort: 30300
