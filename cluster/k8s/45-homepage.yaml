# Homepage: the app list + live checks behind the start page, and the "classic" dashboard.
#   Start page (47-start.yaml): http://100.120.223.33:30300   uses this one's data
#   Classic Homepage:           http://100.120.223.33:30301
# To add or change a tile (shows on both): edit services.yaml below, then
#   kubectl apply -f 45-homepage.yaml && kubectl -n homepage rollout restart deployment homepage
# Logos come from https://github.com/homarr-labs/dashboard-icons (just the name, e.g. jellyfin.png),
# or mdi-<name> from https://pictogrammers.com/library/mdi/
# The green/red dot on each tile is a live check done from inside the cluster.
apiVersion: v1
kind: Namespace
metadata:
  name: homepage
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: homepage-config
  namespace: homepage
data:
  settings.yaml: |
    title: Grayson's Homelab
    description: Raspberry Pi 5 + Pi 4 cluster
    theme: dark
    color: slate
    headerStyle: boxed
    statusStyle: dot
    hideVersion: true
    useEqualHeights: true
    target: _blank
    layout:
      Learning:
        style: row
        columns: 3
        icon: mdi-book-open-variant
      Media:
        style: row
        columns: 3
        icon: mdi-play-box-multiple
      Games:
        style: row
        columns: 3
        icon: mdi-sword-cross
      Website:
        style: row
        columns: 3
        icon: mdi-web
      Cluster & Network:
        style: row
        columns: 3
        icon: mdi-server-network
      Monitoring:
        style: row
        columns: 4
        icon: mdi-chart-line
  services.yaml: |
    - Learning:
        - Pi to DevOps Path:
            icon: mdi-school
            href: http://100.120.223.33:30402
            description: Learning guide + Pomodoro timer
            siteMonitor: http://study.study.svc.cluster.local
    - Media:
        - Jellyfin:
            icon: jellyfin.png
            href: http://100.120.223.33:8096
            description: Movies, TV shows, music and home videos
            siteMonitor: http://jellyfin.media.svc.cluster.local:8096/health
    - Games:
        - Campaign Ledger:
            icon: mdi-dice-d20
            href: https://dnd.graysoncodes.org
            description: D&D tracker - players join with the code
            siteMonitor: http://ledger.ledger.svc.cluster.local:5050/api/join/build
    - Website:
        - graysoncodes.org:
            icon: https://graysoncodes.org/favicon.svg
            href: https://graysoncodes.org
            description: Portfolio (public)
            siteMonitor: http://web.graysoncodes.svc.cluster.local/healthz
        - Blog admin:
            icon: mdi-pencil-box-multiple
            href: https://graysoncodes.org/admin/blog
            description: Write and edit blog posts
            siteMonitor: http://blog.graysoncodes.svc.cluster.local:5080/blog
    - Cluster & Network:
        - Portainer:
            icon: portainer.png
            href: http://100.120.223.33:30777
            description: Manage the cluster (apps, logs, restarts)
            siteMonitor: http://portainer.portainer.svc.cluster.local:9000
        - Pi-hole:
            icon: pi-hole.png
            href: http://100.120.223.33:30880/admin
            description: Ad blocking for your devices
            siteMonitor: http://pihole-web.pihole.svc.cluster.local/admin/
        - Cloudflare:
            icon: cloudflare.png
            href: https://dash.cloudflare.com
            description: Domain and tunnel settings
    - Monitoring:
        - Uptime Kuma:
            icon: uptime-kuma.png
            href: http://100.120.223.33:3001
            description: Is everything up?
            siteMonitor: http://192.168.1.35:3001
        - Grafana:
            icon: grafana.png
            href: http://100.120.223.33:3000
            description: Graphs and dashboards
            siteMonitor: http://192.168.1.35:3000/api/health
        - Prometheus:
            icon: prometheus.png
            href: http://100.120.223.33:9090
            description: Metrics collector
            siteMonitor: http://192.168.1.35:9090/-/healthy
        - Homarr:
            icon: homarr.png
            href: http://100.120.223.33:7575
            description: Old dashboard (Docker)
            siteMonitor: http://192.168.1.35:7575
  widgets.yaml: |
    - kubernetes:
        cluster:
          show: true
          cpu: true
          memory: true
          showLabel: true
          label: Cluster
        nodes:
          show: true
          cpu: true
          memory: true
          showLabel: true
    - datetime:
        text_size: xl
        format:
          dateStyle: long
          timeStyle: short
  kubernetes.yaml: |
    mode: cluster
  bookmarks.yaml: ""
  docker.yaml: ""
  custom.css: |
    @import url("https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap");

    /* Grayson's Homelab: same look as the Pi to DevOps Path guide.
       Homepage colors everything from --color-50..900; these replace the "slate" ramp with
       the guide's cool neutrals, and the icon gradient with its cobalt accent. */
    html.theme-slate {
      --color-50: 246 247 249;  --color-100: 238 241 246; --color-200: 227 230 236; --color-300: 200 205 214;
      --color-400: 160 167 180; --color-500: 124 132 149; --color-600: 75 82 97;    --color-700: 46 51 61;
      --color-800: 21 24 30;    --color-900: 15 17 21;
      --color-logo-start: 51 82 204; --color-logo-stop: 51 82 204;
    }
    :root {
      --hl-bg: #f6f7f9; --hl-panel: #ffffff; --hl-line: #e3e6ec; --hl-hover: #eef1f6;
      --hl-ink: #16181d; --hl-ink2: #4b5261; --hl-ink3: #7c8495; --hl-accent: #3352cc;
      --hl-font: "Geist", "Segoe UI", system-ui, sans-serif; --hl-mono: "Geist Mono", Consolas, monospace;
    }
    html.dark {
      --hl-bg: #0f1115; --hl-panel: #15181e; --hl-line: #252a32; --hl-hover: #1b1f27;
      --hl-ink: #eceef2; --hl-ink2: #aab1bd; --hl-ink3: #7e8696; --hl-accent: #8aa0ff;
      --color-logo-start: 138 160 255; --color-logo-stop: 138 160 255;
    }

    html, body, #__next, #page_wrapper { background: var(--hl-bg) !important; }
    body { font-family: var(--hl-font) !important; color: var(--hl-ink); -webkit-font-smoothing: antialiased; }
    #inner_wrapper { max-width: 1280px; margin: 0 auto; }

    /* top bar: cluster CPU/memory + date */
    #information-widgets { background: var(--hl-panel) !important; border: 1px solid var(--hl-line); box-shadow: none !important; border-radius: 12px !important; }
    #information-widgets, #information-widgets * { font-variant-numeric: tabular-nums; }
    .information-widget-datetime span { font-weight: 500; letter-spacing: -.01em; color: var(--hl-ink) !important; }

    /* group headings */
    .services-group { padding-top: 10px !important; }
    .service-group-name { font-size: 15px !important; font-weight: 600 !important; letter-spacing: -.01em; color: var(--hl-ink) !important; }
    .service-group-icon { width: 22px !important; height: 22px !important; display: grid; place-items: center; }
    .service-group-icon > div { width: 18px !important; height: 18px !important; background: var(--hl-ink3) !important; }
    .services-list { row-gap: 2px; }

    /* app tiles */
    .service-card {
      background: var(--hl-panel) !important; border: 1px solid var(--hl-line); box-shadow: none !important;
      border-radius: 12px !important; padding: 8px 6px !important;
      transition: border-color .15s ease, background-color .15s ease, transform .15s ease !important;
    }
    .service-card:hover { background: var(--hl-hover) !important; border-color: var(--hl-accent); }
    .service-card:focus-within { border-color: var(--hl-accent); }
    .service-icon > div { width: 26px !important; height: 26px !important; background: var(--hl-accent) !important; }
    .service-icon img { width: 30px !important; height: 30px !important; object-fit: contain; }
    .service-name { font-size: 14.5px !important; font-weight: 600 !important; color: var(--hl-ink) !important; letter-spacing: -.005em; }
    .service-description { font-size: 12.5px !important; font-weight: 400 !important; color: var(--hl-ink3) !important; margin-top: 2px; line-height: 1.4; }
    .service-title-text:focus-visible, .service-icon:focus-visible { outline: 2px solid var(--hl-accent); outline-offset: 2px; border-radius: 8px; }

    /* status: small dot with a soft ring, top right */
    .site-monitor-status .rounded-full { width: 8px !important; height: 8px !important; box-shadow: 0 0 0 3px rgb(16 185 129 / .18); }
    .site-monitor-status .bg-rose-500 { box-shadow: 0 0 0 3px rgb(244 63 94 / .2); }

    /* when a check shows text (response time or an error code) instead of a dot: a small quiet pill */
    .site-monitor-status { border-radius: 999px !important; background: transparent !important; border: 1px solid var(--hl-line); padding: 1px 7px !important; }
    .site-monitor-status > div:not(.rounded-full) { font: 500 10px/1.4 var(--hl-mono) !important; letter-spacing: .02em; text-transform: lowercase !important; }

    /* footer: keep the refresh and theme buttons, drop the version line */
    #version { display: none !important; }
    #footer { padding-top: 8px !important; padding-bottom: 24px !important; }

    @media (prefers-reduced-motion: reduce) { .service-card { transition: none !important; } }
  custom.js: ""
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: homepage
  namespace: homepage
---
# Read-only access so the top bar can show the Pis' CPU and memory.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: homepage
rules:
  - apiGroups: [""]
    resources: [namespaces, pods, nodes]
    verbs: [get, list]
  - apiGroups: [metrics.k8s.io]
    resources: [nodes, pods]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: homepage
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: homepage
subjects:
  - kind: ServiceAccount
    name: homepage
    namespace: homepage
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: homepage
  namespace: homepage
spec:
  replicas: 1
  selector:
    matchLabels: {app: homepage}
  template:
    metadata:
      labels: {app: homepage}
    spec:
      serviceAccountName: homepage
      automountServiceAccountToken: true
      containers:
        - name: homepage
          image: ghcr.io/gethomepage/homepage:v1.12.0
          env:
            # Addresses you may type in the browser. Add new ones here if you use another.
            - name: HOMEPAGE_ALLOWED_HOSTS
              value: "192.168.1.35:30301,192.168.1.36:30301,100.120.223.33:30301,raspberrypi.local:30301,pi2.local:30301,localhost:30301,localhost:30300"
          ports:
            - containerPort: 3000
          volumeMounts:
            - {name: config, mountPath: /app/config/settings.yaml, subPath: settings.yaml}
            - {name: config, mountPath: /app/config/services.yaml, subPath: services.yaml}
            - {name: config, mountPath: /app/config/widgets.yaml, subPath: widgets.yaml}
            - {name: config, mountPath: /app/config/kubernetes.yaml, subPath: kubernetes.yaml}
            - {name: config, mountPath: /app/config/bookmarks.yaml, subPath: bookmarks.yaml}
            - {name: config, mountPath: /app/config/docker.yaml, subPath: docker.yaml}
            - {name: config, mountPath: /app/config/custom.css, subPath: custom.css}
            - {name: config, mountPath: /app/config/custom.js, subPath: custom.js}
            - {name: logs, mountPath: /app/config/logs}
          readinessProbe:
            tcpSocket: {port: 3000}
            periodSeconds: 10
          resources:
            requests: {cpu: 20m, memory: 64Mi}
            limits: {memory: 256Mi}
      volumes:
        - name: config
          configMap:
            name: homepage-config
        - name: logs
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: homepage
  namespace: homepage
spec:
  type: NodePort
  selector: {app: homepage}
  ports:
    - port: 3000
      targetPort: 3000
      nodePort: 30301
