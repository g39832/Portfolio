# Practice terminals: a web terminal with a lab per learning topic, for phone or PC.
#   http://100.120.223.33:30410   (Tailscale, from anywhere)   http://192.168.1.35:30410 at home
#   Open a lab straight away with ?arg=git (linux bash git k8s net containers docker security backups ci iac pi).
# Image: cluster/sandbox.Dockerfile -> ghcr.io/g39832/portfolio-sandbox. Labs: cluster/sandbox/envs/.
# Put it up or update it with:  bash ~/Portfolio/cluster/sandbox/deploy.sh
# (that makes the login secret the first time and prints the password).
#
# Safety: the terminal's kubectl account can READ the cluster (the built-in "view" role, which
# leaves out Secrets) and can only CHANGE the "playground" namespace. Playground pods are held to
# Pod Security "baseline" (no hostPath, privileged or host network), small default limits, and a
# quota. The "pi" lab is only an SSH client: it needs your real Pi password.
#
# Docker: every lab has a real `docker` command (plus compose and buildx). It talks to a private
# Docker engine (Docker-in-Docker) that runs next to the terminal in this pod, NOT to the Pi 5's
# own Docker, so nothing you do here can stop Uptime Kuma, Containerlab or the other real
# containers. That engine has to be privileged, which is why this pod sits in "sandbox" and not
# in "playground". It only listens on a socket inside the pod (no network port). Its images live
# in /var/lib/sandbox-docker on the Pi 5. `-p 8080:80` publishes on this pod, so
# `curl localhost:8080` works from the terminal. Wipe it all with `docker system prune -a`.
apiVersion: v1
kind: Namespace
metadata:
  name: sandbox
---
apiVersion: v1
kind: Namespace
metadata:
  name: playground
  labels:
    pod-security.kubernetes.io/enforce: baseline
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: learner
  namespace: sandbox
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: sandbox-learner-view
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: view}
subjects:
  - {kind: ServiceAccount, name: learner, namespace: sandbox}
---
# "view" leaves out cluster-wide things the lessons look at: nodes, volumes, storage classes,
# node metrics and the API server's health pages. Read-only.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: sandbox-cluster-read
rules:
  - apiGroups: [""]
    resources: [nodes, persistentvolumes]
    verbs: [get, list, watch]
  - apiGroups: [storage.k8s.io]
    resources: [storageclasses]
    verbs: [get, list, watch]
  - apiGroups: [metrics.k8s.io]
    resources: [nodes, pods]
    verbs: [get, list]
  - apiGroups: [apiextensions.k8s.io]
    resources: [customresourcedefinitions]
    verbs: [get, list]
  - nonResourceURLs: [/readyz, /readyz/*, /livez, /livez/*, /healthz, /version]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: sandbox-learner-cluster-read
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: sandbox-cluster-read}
subjects:
  - {kind: ServiceAccount, name: learner, namespace: sandbox}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: learner-edit
  namespace: playground
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: edit}
subjects:
  - {kind: ServiceAccount, name: learner, namespace: sandbox}
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: playground
  namespace: playground
spec:
  hard:
    pods: "20"
    requests.cpu: "1"
    requests.memory: 1Gi
    limits.memory: 2Gi
    persistentvolumeclaims: "2"
    requests.storage: 2Gi
    services.nodeports: "2"
    services.loadbalancers: "0"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: playground
  namespace: playground
spec:
  limits:
    - type: Container
      defaultRequest: {cpu: 20m, memory: 32Mi}
      default: {cpu: 250m, memory: 128Mi}
      max: {memory: 512Mi}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: work
  namespace: sandbox
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests: {storage: 2Gi}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sandbox
  namespace: sandbox
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: sandbox}
  template:
    metadata:
      labels: {app: sandbox}
    spec:
      serviceAccountName: learner
      nodeSelector:
        kubernetes.io/hostname: raspberrypi     # the Pi 5: more memory and disk
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        runAsNonRoot: true
      containers:
        - name: ttyd
          image: ghcr.io/g39832/portfolio-sandbox:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 7681
          env:
            - name: TTYD_CREDENTIAL
              valueFrom:
                secretKeyRef: {name: sandbox-login, key: credential}
            - name: HOST_IP                      # the Pi 5's address, for "ssh pi5"
              valueFrom:
                fieldRef: {fieldPath: status.hostIP}
            - name: TZ
              value: America/Chicago
            - name: DOCKER_HOST                  # the private Docker engine below
              value: unix:///run/docker/docker.sock
          volumeMounts:
            - {name: work, mountPath: /work}
            - {name: docker-sock, mountPath: /run/docker}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          readinessProbe:
            tcpSocket: {port: 7681}
            periodSeconds: 10
          resources:
            requests: {cpu: 50m, memory: 96Mi}
            limits: {memory: 1Gi}
        # The labs' own Docker engine. It matches its network MTU to the pod's (flannel is smaller
        # than 1500, and a bigger MTU makes downloads inside containers hang), and gives the socket
        # to group 1000 so the terminal's user can use it without sudo.
        - name: docker
          image: docker:29.10.1-dind
          command:
            - sh
            - -c
            - |
              mtu="$(cat /sys/class/net/eth0/mtu 2>/dev/null || echo 1450)"
              rm -f /run/docker/docker.sock /var/run/docker.pid
              exec dockerd-entrypoint.sh dockerd                 --host=unix:///run/docker/docker.sock --group=1000                 --mtu="$mtu" --default-network-opt="bridge=com.docker.network.driver.mtu=$mtu"                 --log-opt=max-size=10m --log-opt=max-file=3
          env:
            - name: DOCKER_TLS_CERTDIR           # socket only, so no TLS certificates needed
              value: ""
          securityContext:
            privileged: true
            runAsUser: 0
            runAsGroup: 0
            runAsNonRoot: false
          volumeMounts:
            - {name: docker-sock, mountPath: /run/docker}
            - {name: docker-data, mountPath: /var/lib/docker}
            - {name: work, mountPath: /work}     # so bind mounts like -v ./site:/usr/share/nginx/html work
          readinessProbe:
            exec:
              command: [docker, -H, unix:///run/docker/docker.sock, version]
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command: [docker, -H, unix:///run/docker/docker.sock, version]
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 4
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {memory: 2Gi}
      volumes:
        - name: work
          persistentVolumeClaim:
            claimName: work
        - name: docker-sock
          emptyDir: {}
        # A plain folder on the Pi 5 (not a PVC) so Kubernetes never re-owns the image files.
        - name: docker-data
          hostPath:
            path: /var/lib/sandbox-docker
            type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: sandbox
  namespace: sandbox
spec:
  type: NodePort
  selector: {app: sandbox}
  ports:
    - port: 80
      targetPort: 7681
      nodePort: 30410
