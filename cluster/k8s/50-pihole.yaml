# Pi-hole: blocks ads and trackers for any device that uses it for DNS.
# Runs on the Pi 4 (pi2) so the Pi 5 stays free for Jellyfin.
#   DNS server:  192.168.1.36   (port 53 on the Pi 4 itself)
#   Admin page:  http://192.168.1.36:30880/admin   (or via Tailscale/the Pi 5's IP)
# Set your admin password (you type it; it is never stored in git):
#   kubectl -n pihole exec -it deploy/pihole -- pihole setpassword
# Only devices you point at 192.168.1.36 use it. Nothing changes for the rest of
# the house until the Orbi's DNS setting is changed.
apiVersion: v1
kind: Namespace
metadata:
  name: pihole
---
# Block lists, settings and your password live here (on the Pi 4).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pihole-data
  namespace: pihole
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pihole
  namespace: pihole
spec:
  replicas: 1
  strategy:
    type: Recreate          # only one copy can hold port 53
  selector:
    matchLabels: {app: pihole}
  template:
    metadata:
      labels: {app: pihole}
    spec:
      nodeSelector:
        kubernetes.io/hostname: pi2
      containers:
        - name: pihole
          image: pihole/pihole:2026.10.1
          env:
            - {name: TZ, value: America/Chicago}
            # Answer devices anywhere on the home network, not just the container's own subnet.
            - {name: FTLCONF_dns_listeningMode, value: all}
            # Where Pi-hole sends allowed lookups (Cloudflare and Quad9).
            - {name: FTLCONF_dns_upstreams, value: "1.1.1.1;9.9.9.9"}
          ports:
            - {name: dns-udp, containerPort: 53, hostPort: 53, protocol: UDP}
            - {name: dns-tcp, containerPort: 53, hostPort: 53, protocol: TCP}
            - {name: web, containerPort: 80, protocol: TCP}
          securityContext:
            capabilities:
              add: [NET_BIND_SERVICE, SYS_NICE, CHOWN, SETUID, SETGID, SETFCAP]
          volumeMounts:
            - name: data
              mountPath: /etc/pihole
          readinessProbe:
            tcpSocket: {port: 53}
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests: {cpu: 20m, memory: 64Mi}
            limits: {memory: 256Mi}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: pihole-data
---
apiVersion: v1
kind: Service
metadata:
  name: pihole-web
  namespace: pihole
spec:
  type: NodePort
  selector: {app: pihole}
  ports:
    - name: web
      port: 80
      targetPort: 80
      nodePort: 30880
