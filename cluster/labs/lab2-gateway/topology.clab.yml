# Lab 2: One router, two networks (gateways)
# pc1 (10.0.1.0/24) and pc2 (10.0.2.0/24) are on different networks. r1 sits between them,
# but nobody has set it up yet, and the PCs don't know where their gateway is.
name: lab2
topology:
  defaults:
    kind: linux
  nodes:
    r1:
      image: quay.io/frrouting/frr:10.4.5
      binds: ["../daemons:/etc/frr/daemons", "../vtysh.conf:/etc/frr/vtysh.conf", "r1/frr.conf:/etc/frr/frr.conf"]
      exec: ["sysctl -qw net.ipv4.ip_forward=1", "ip route del default"]
    pc1:
      image: nicolaka/netshoot:v0.14
      cmd: sleep infinity
      exec: ["ip route del default", "ip addr add 10.0.1.10/24 dev eth1"]
    pc2:
      image: nicolaka/netshoot:v0.14
      cmd: sleep infinity
      exec: ["ip route del default", "ip addr add 10.0.2.10/24 dev eth1"]
  links:
    - endpoints: ["pc1:eth1", "r1:eth1"]
    - endpoints: ["r1:eth2", "pc2:eth1"]
