# Front door for the practice terminals (start.sh fills in COOKIE and makes /tmp/htpasswd).
# Why: iPhone Safari doesn't send the password on WebSocket connections, so ttyd's own login
# broke the terminal on phones. nginx asks for the password on the page instead, then hands
# out a cookie, and the terminal's WebSocket (/ws) is let in by that cookie.
pid /tmp/nginx.pid;
worker_processes 1;
error_log /dev/stderr warn;
events { worker_connections 128; }
http {
  access_log off;
  client_body_temp_path /tmp/nginx-body;
  proxy_temp_path /tmp/nginx-proxy;
  fastcgi_temp_path /tmp/nginx-fastcgi;
  uwsgi_temp_path /tmp/nginx-uwsgi;
  scgi_temp_path /tmp/nginx-scgi;
  map $http_upgrade $connection_upgrade { default upgrade; "" close; }

  server {
    listen 7681;

    location = /ws {
      if ($cookie_practice_labs != "COOKIE") { return 403; }
      proxy_pass http://unix:/tmp/ttyd.sock;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Authorization "";
      proxy_read_timeout 1d;
      proxy_send_timeout 1d;
    }

    location / {
      auth_basic "Practice labs";
      auth_basic_user_file /tmp/htpasswd;
      add_header Set-Cookie "practice_labs=COOKIE; Path=/; HttpOnly; SameSite=Lax; Max-Age=2592000" always;
      add_header Cache-Control "no-cache" always;
      proxy_pass http://unix:/tmp/ttyd.sock;
      proxy_set_header Authorization "";
    }
  }
}
