# Front door for the course and the practice terminals (start.sh fills in COOKIE and makes /tmp/htpasswd).
#   /          the course (course/server.py on 127.0.0.1:7700)
#   /term/     the terminals (ttyd, base path /term)
# Why the cookie: iPhone Safari doesn't send the password on WebSocket connections, so ttyd's own
# login broke the terminal on phones. nginx asks for the password on the page instead, then hands
# out a cookie, and the terminal's WebSocket (/term/ws) is let in by that cookie.
pid /tmp/nginx.pid;
worker_processes 1;
error_log /dev/stderr warn;
events { worker_connections 128; }
http {
  access_log off;
  client_body_temp_path /tmp/nginx-body;
  proxy_temp_path /tmp/nginx-proxy;
  fastcgi_temp_path /tmp/nginx-fastcgi;
  uwsgi_temp_path /tmp/nginx-uwsgi;
  scgi_temp_path /tmp/nginx-scgi;
  map $http_upgrade $connection_upgrade { default upgrade; "" close; }

  server {
    listen 7681;
    # Redirects keep whatever address and port you used (the NodePort 30410), not nginx's own 7681.
    absolute_redirect off;
    auth_basic "Practice labs";
    auth_basic_user_file /tmp/htpasswd;

    location = /term/ws {
      auth_basic off;
      if ($cookie_practice_labs != "COOKIE") { return 403; }
      proxy_pass http://unix:/tmp/ttyd.sock;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Authorization "";
      proxy_read_timeout 1d;
      proxy_send_timeout 1d;
    }

    location = /term { return 302 /term/$is_args$args; }

    location /term/ {
      add_header Set-Cookie "practice_labs=COOKIE; Path=/; HttpOnly; SameSite=Lax; Max-Age=2592000" always;
      add_header Cache-Control "no-cache" always;
      proxy_pass http://unix:/tmp/ttyd.sock;
      proxy_set_header Authorization "";
    }

    # Old links (start page, bookmarks) were :30410/?arg=<lab>: send those to the terminal.
    location = / {
      if ($arg_arg) { return 302 /term/$is_args$args; }
      add_header Set-Cookie "practice_labs=COOKIE; Path=/; HttpOnly; SameSite=Lax; Max-Age=2592000" always;
      proxy_pass http://127.0.0.1:7700;
      proxy_set_header Authorization "";
    }

    location / {
      add_header Set-Cookie "practice_labs=COOKIE; Path=/; HttpOnly; SameSite=Lax; Max-Age=2592000" always;
      client_max_body_size 64k;
      proxy_pass http://127.0.0.1:7700;
      proxy_set_header Authorization "";
      proxy_read_timeout 150s;
    }
  }
}
