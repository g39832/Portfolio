# One tmux per lab, so a dropped phone connection doesn't end your session.
set -g mouse on
set -g history-limit 5000
set -sg escape-time 0
set -g default-terminal "tmux-256color"
set -g status-style "bg=#15181e,fg=#aab1bd"
set -g status-left "#[fg=#8aa0ff,bold] #{session_name} #[default]"
set -g status-left-length 20
set -g status-right "learn = missions  ·  %H:%M "
set -g window-status-current-format ""
set -g window-status-format ""
