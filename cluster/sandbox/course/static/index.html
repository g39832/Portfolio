<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>DevOps Path</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0f1115">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon.svg">
<link rel="stylesheet" href="/app.css">
</head>
<body>
<header class="top">
  <a class="brand" href="#/"><span class="mark" aria-hidden="true"></span><span>DevOps Path</span></a>
  <nav>
    <a href="#/" data-nav="home">Home</a>
    <a href="#/map" data-nav="map">Course</a>
    <a href="#/review" data-nav="review">Review<span class="pill" id="due" hidden></span></a>
  </nav>
</header>
<main id="view" tabindex="-1"></main>
<!-- One terminal for the lesson you're on. It stays loaded while you move between lessons in the
     same lab, so the shell keeps its place. -->
<aside id="termpane" aria-label="Terminal" hidden>
  <div class="termbar">
    <span class="dot"></span><b id="termlab">Terminal</b>
    <a id="termfull" target="_blank" rel="noopener">Full screen ↗</a>
    <button type="button" id="termhide" class="btn ghost small">Hide</button>
  </div>
  <iframe id="term" title="Practice terminal" allow="clipboard-read; clipboard-write"></iframe>
</aside>
<nav class="tabs" id="tabs" hidden aria-label="Lesson or terminal">
  <button type="button" data-tab="lesson" aria-pressed="true">Lesson</button>
  <button type="button" data-tab="term" aria-pressed="false">Terminal</button>
</nav>
<div id="toast" role="status" aria-live="polite"></div>
<script src="/app.js"></script>
</body>
</html>
