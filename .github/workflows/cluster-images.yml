# Builds the two images the Pi cluster runs and publishes them to GitHub's
# container registry (ghcr.io/g39832/portfolio-web and portfolio-blog).
# Runs on every push to main that touches the site or the blog. Afterwards, on the Pi 5:
#   kubectl -n graysoncodes rollout restart deployment web blog
name: Cluster images

on:
  push:
    branches: [main]
    paths:
      - my-react-app/**
      - blog/**
      - cluster/**
      - .github/workflows/cluster-images.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image: [web, blog]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: cluster/${{ matrix.image }}.Dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/g39832/portfolio-${{ matrix.image }}:latest
            ghcr.io/g39832/portfolio-${{ matrix.image }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
